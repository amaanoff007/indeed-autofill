<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui; width: 300px; margin: 12px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  button { width: 100%; padding: 8px; margin: 4px 0; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; }
  #fill { background: #2557a7; color: #fff; }
  #export { background: #e8eefa; }
  #clear { background: #f4f4f4; color: #a00; }
  ul { padding-left: 16px; max-height: 180px; overflow: auto; margin: 6px 0; }
  li { margin: 2px 0; }
  .muted { color: #777; }
</style>
</head>
<body>
  <h1>Indeed Autofill</h1>
  <label><input type="checkbox" id="auto"> <b>Auto mode</b> — fill &amp; Continue each step, stop at Submit</label>
  <button id="fill">Fill this step</button>
  <p><b id="count">0</b> applications logged · <span id="today">0</span> today</p>
  <ul id="recent"></ul>
  <button id="export">Export log as CSV</button>
  <button id="clear">Clear log</button>
  <p class="muted">Edit answers in profile.js, then reload the extension.</p>
  <script src="popup.js"></script>
</body>
</html>
